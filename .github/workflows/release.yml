name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: |
          zip more_attacks.zip manifest.json main.lua LICENSE README.md

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: more_attacks.zip
